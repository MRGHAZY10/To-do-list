<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/8e7c793750.js" crossorigin="anonymous"></script>
</head>

<body>
    <main>
        <div class="section-center">
            <div class="todo-form">
                <h3>To Do List</h3>
                <div class="form-control">
                    <input type="text" name="todo-list" id="todo-input" placeholder="e.g. Go to the market">
                    <input type="submit" class="add-btn" value="Add">
                </div>
            </div>

            <div class="controls">
                <div class="filters">
                    <span class="active" id="all">All</span>
                    <span id="pending">Pending</span>
                    <span id="completed">Completed</span>
                </div>

                <button type="button" class="clear-btn">Clear all Items</button>
            </div>

            <div class="todo-container">
                <div class="todo-list">
                    <!-- Dynamic todo items render here -->
                </div>

                <div class="alert-message">
                    <span class="alert"></span>
                </div>

                <div id="counter">
                    <span class="counter-left">0</span> pending &amp;
                    <span class="counter-completed">0</span> completed
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
